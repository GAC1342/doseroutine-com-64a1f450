version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    open-pull-requests-limit: 10
    labels: [dependencies]
    groups:
      radix-ui:
        patterns: ["@radix-ui/*"]
      tanstack:
        patterns: ["@tanstack/*"]
      capacitor:
        patterns: ["@capacitor/*", "@capacitor-mlkit/*"]
      dev-tooling:
        patterns: ["eslint*", "prettier*", "vitest", "@playwright/*", "@axe-core/*", "typescript"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [dependencies, ci]
