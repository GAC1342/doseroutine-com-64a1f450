name: route-bundles

# Per-route JS bundle-size regression gate.
# Builds the client, resolves the chunks each tracked route downloads on first
# load, and fails when any route grows past its baseline in
# route-bundle-baselines.json (tolerance from route-bundle-budgets.json).
# Intentional growth: run `npm run bundles:baseline` and commit the new numbers.
on:
  workflow_dispatch:
jobs:
  bundles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Build client
        run: npm run build
      - name: Assert per-route bundle budgets
        run: node scripts/check-route-bundles.mjs
      - name: Bundle report
        if: always()
        run: node scripts/check-route-bundles.mjs --json > route-bundle-report.json || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: route-bundle-report
          path: route-bundle-report.json
          if-no-files-found: ignore
