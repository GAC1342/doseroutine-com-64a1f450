name: landing-overlay-collisions (E2E)

# Verifies the landing page's bottom-fixed layers (cookie notice, install
# banner, sticky signup bar) never overlap on a phone, and that only one
# primary "Sign up free" CTA is visible per viewport.
#
# Runs on both engines the spec emulates: Chromium (Pixel 7) and WebKit
# (iPhone 14). Both binaries are installed, so a missing engine fails the job.
on:
  push:
    branches: [main]
    paths:
      - "src/routes/index.tsx"
      - "src/components/cookie-banner.tsx"
      - "e2e/landing-overlay-collisions.spec.ts"
      - ".github/workflows/landing-overlay-collisions.yml"
  pull_request:
    paths:
      - "src/routes/index.tsx"
      - "src/components/cookie-banner.tsx"
      - "e2e/landing-overlay-collisions.spec.ts"
  workflow_dispatch:
    inputs:
      base:
        description: Base URL to test (blank = build & serve locally)
        default: ""
        required: false

jobs:
  overlays:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers (chromium + webkit)
        run: bunx playwright install --with-deps chromium webkit
      - name: Run landing overlay collision E2E
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base }}
        run: bunx playwright test e2e/landing-overlay-collisions.spec.ts --project=chromium --reporter=list
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: landing-overlay-collisions-traces
          path: test-results/
          retention-days: 7
