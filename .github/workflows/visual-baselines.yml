name: Generate visual baselines

# Baselines must be generated on the same OS/engine build CI compares against,
# so they cannot be produced on a laptop (or in a sandbox image whose Firefox
# does not match this Playwright version). This job runs the visual suites with
# --update-snapshots on ubuntu-latest and opens a PR with the resulting PNGs.
#
# Run it when:
#   - a new browser project (e.g. firefox) has no baselines yet,
#   - an intentional design change invalidated the existing ones,
#   - Playwright was upgraded and the bundled engines re-rendered.
on:
  workflow_dispatch:
    inputs:
      projects:
        description: Playwright projects (comma separated)
        default: chromium,firefox,webkit
        required: false
      specs:
        description: Spec files to regenerate
        default: e2e/exercise-art-visual.spec.ts e2e/exercise-art-landscape.spec.ts
        required: false
      viewports:
        description: ART_VIEWPORTS filter (all, mobile, desktop, or names)
        default: all
        required: false
      open_pr:
        description: Open a pull request with the new baselines
        type: boolean
        default: true

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Install browsers and OS dependencies
        run: bunx playwright install --with-deps ${{ inputs.projects && join(fromJson(format('["{0}"]', replace(inputs.projects, ',', '","'))), ' ') || 'chromium firefox webkit' }}

      # Fails fast with an actionable message instead of dying mid-suite.
      - name: Verify every engine actually launches
        run: node scripts/check-playwright-browsers.mjs --require=${{ inputs.projects || 'chromium,firefox,webkit' }}

      - name: Regenerate baselines
        env:
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          ART_VIEWPORTS: ${{ inputs.viewports || 'all' }}
          E2E_STRICT_BROWSERS: "1"
        run: >-
          node scripts/run-e2e.mjs ${{ inputs.specs || 'e2e/exercise-art-visual.spec.ts e2e/exercise-art-landscape.spec.ts' }}
          --projects=${{ inputs.projects || 'chromium,firefox,webkit' }}
          --update-snapshots

      - name: Summarise what changed
        if: always()
        run: |
          {
            echo "### Baseline changes"
            echo
            echo '```'
            git status --porcelain -- 'e2e/**-snapshots' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the reviewable gallery (baselines + diffs + HTML report)
        if: always()
        run: >-
          node scripts/collect-visual-artifacts.mjs
          --out visual-artifacts
          --projects ${{ inputs.projects || 'chromium,firefox,webkit' }}
          --label "baselines ${{ inputs.projects || 'chromium,firefox,webkit' }}"

      - name: Upload baselines as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: e2e/**-snapshots/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the browsable gallery + HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-artifacts-baselines-${{ github.run_attempt }}
          path: visual-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Open a pull request with the new baselines
        if: ${{ inputs.open_pr }}
        uses: peter-evans/create-pull-request@v6
        with:
          add-paths: e2e/**-snapshots/**
          branch: chore/visual-baselines-${{ github.run_id }}
          commit-message: "test(e2e): regenerate visual baselines (${{ inputs.projects || 'chromium,firefox,webkit' }})"
          title: "test(e2e): regenerate visual baselines"
          body: |
            Generated by the **Generate visual baselines** workflow.

            - projects: `${{ inputs.projects || 'chromium,firefox,webkit' }}`
            - specs: `${{ inputs.specs }}`
            - viewports: `${{ inputs.viewports || 'all' }}`

            Review the PNG diffs before merging: these images are the contract
            the illustration visual suite enforces.
