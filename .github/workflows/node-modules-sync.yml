name: node-modules-sync

# Fails when the installed dependency tree drifts from package-lock.json.
# Complements lockfile-integrity.yml (package.json <-> lockfile) by checking
# the other half: lockfile <-> node_modules actually on disk.

on:
  workflow_dispatch:

concurrency:
  group: node-modules-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-modules-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The same install command the check tells developers to run on failure,
      # so a green CI run proves that command produces a synced tree.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify node_modules matches package-lock.json
        run: node scripts/check-node-modules-sync.mjs
