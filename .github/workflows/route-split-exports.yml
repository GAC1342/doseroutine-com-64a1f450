name: Route split export safety

on:
  pull_request:
  push:
    branches: [main]

jobs:
  route-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check route code-splitting exports
        run: node scripts/check-route-split-exports.mjs
