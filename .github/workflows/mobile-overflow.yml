name: mobile-overflow (E2E)

# Fails if any page can scroll horizontally at a phone/tablet viewport, or if a
# bottom sheet's content sticks out past the right edge of the screen.
# Tests run at 360/390/430px phones and 768/1024px tablets to catch
# device-specific layout issues.
on:
  push:
    branches: [main]
    paths:
      - "src/components/ui/sheet.tsx"
      - "src/components/workout-log-sheet.tsx"
      - "src/components/muscle-group-picker.tsx"
      - "src/styles.css"
      - "e2e/mobile-horizontal-overflow.spec.ts"
      - ".github/workflows/mobile-overflow.yml"
  pull_request:
    paths:
      - "src/components/ui/sheet.tsx"
      - "src/components/workout-log-sheet.tsx"
      - "src/components/muscle-group-picker.tsx"
      - "src/styles.css"
      - "e2e/mobile-horizontal-overflow.spec.ts"
  workflow_dispatch:
    inputs:
      base:
        description: Base URL to test (blank = build & serve locally)
        default: ""
        required: false

jobs:
  overflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Run mobile overflow E2E at 360/390/430px
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
        run: bunx playwright test e2e/mobile-horizontal-overflow.spec.ts --project=chromium --reporter=list,html
      # Screenshots (with the overflowing element outlined in red), videos and
      # traces for every failed viewport, so a cutoff can be diagnosed from the
      # run page without reproducing it locally.
      - name: Upload Playwright failure artifacts (screenshots + video + traces)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-overflow-failures-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload HTML report (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-overflow-report-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
