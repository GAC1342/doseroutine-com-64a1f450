name: Native smoke gate

# Crash-free gate for the iOS/Android shell. Any uncaught error, unexpected
# console error, 5xx, fatal-error UI or blank screen during launch, permission
# denials, offline cold start or deep-link routing fails the build.
on:
  workflow_dispatch:
concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Native smoke (launch, permissions, offline, deep links)
        run: npm run test:e2e:native-gate
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-report
          path: |
            playwright-report
            test-results
          retention-days: 14
